<title>Meal Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --ground-top:#E9EFFC;--ground-bot:#FFF4DE;--paper:#FFFFFF;--paper-tint:#F5F8FF;
  --ink:#1E2350;--ink-soft:#5C6396;--ink-muted:#8B92C0;--line:#CFD9F2;--grid:#E6EBF8;
  --sun:#FFC13B;--sun-deep:#EE9B14;--good:#0ca30c;--good-tint:#DFF5DC;
  --breakfast:#EE9B14;--breakfast-tint:#FDEFD3;--lunch:#0ca30c;--lunch-tint:#DFF5DC;
  --dinner:#5B3DE0;--dinner-tint:#E7E1FC;--snack:#E0532E;--snack-tint:#FBE3DB;
  --protein:#C23B2E;--carb:#A47910;--vegetable:#2E9E3F;--wholemeal:#6C4FE0;
  --shadow:0 10px 30px rgba(30,35,80,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground-top:#0D1233;--ground-bot:#241E38;--paper:#191F45;--paper-tint:#141A3B;
    --ink:#EEF2FF;--ink-soft:#A6AFDF;--ink-muted:#7E86B8;--line:#333C74;--grid:#2A3260;
    --sun:#FFCE5C;--sun-deep:#FFB021;--good:#3ecb3e;--good-tint:#163A1A;
    --breakfast:#FFB021;--breakfast-tint:#3A2E14;--lunch:#3ecb3e;--lunch-tint:#163A1A;
    --dinner:#9480F0;--dinner-tint:#28204A;--snack:#F07B5A;--snack-tint:#3A241C;
    --protein:#F0756A;--carb:#E0BC57;--vegetable:#5FCB73;--wholemeal:#A68FF5;
    --shadow:0 10px 30px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  --ground-top:#0D1233;--ground-bot:#241E38;--paper:#191F45;--paper-tint:#141A3B;
  --ink:#EEF2FF;--ink-soft:#A6AFDF;--ink-muted:#7E86B8;--line:#333C74;--grid:#2A3260;
  --sun:#FFCE5C;--sun-deep:#FFB021;--good:#3ecb3e;--good-tint:#163A1A;
  --breakfast:#FFB021;--breakfast-tint:#3A2E14;--lunch:#3ecb3e;--lunch-tint:#163A1A;
  --dinner:#9480F0;--dinner-tint:#28204A;--snack:#F07B5A;--snack-tint:#3A241C;
  --protein:#F0756A;--carb:#E0BC57;--vegetable:#5FCB73;--wholemeal:#A68FF5;
  --shadow:0 10px 30px rgba(0,0,0,.32);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);background:linear-gradient(168deg,var(--ground-top) 0%,var(--ground-bot) 100%);
  background-attachment:fixed;min-height:100vh;-webkit-text-size-adjust:100%;
}
.wrap{max-width:860px;margin:0 auto;padding:clamp(14px,2.4vw,30px) clamp(12px,2.4vw,28px) 56px;display:flex;flex-direction:column;gap:clamp(12px,1.8vw,20px)}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{width:44px;height:44px;flex:none}
h1{font-family:"Grandstander","Nunito",sans-serif;font-weight:800;font-size:clamp(1.6rem,3.4vw,2.4rem);margin:0;line-height:1}
.sub{margin:.25em 0 0;font-weight:700;color:var(--ink-soft);font-size:clamp(.82rem,1.3vw,.95rem)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:800;font-size:.76rem;color:var(--ink-soft)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-muted);flex:none}
.chip.live .dot{background:var(--good)}

.card{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:clamp(14px,2vw,22px)}
.eyebrow{font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 10px}

/* ---------------- shared controls ---------------- */
.seg{display:inline-flex;background:var(--paper-tint);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font-family:inherit;font-weight:800;font-size:.82rem;color:var(--ink-soft);background:transparent;border:none;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[aria-pressed="true"][data-v="breakfast"]{background:var(--breakfast)}
.seg button[aria-pressed="true"][data-v="lunch"]{background:var(--lunch)}
.seg button[aria-pressed="true"][data-v="dinner"]{background:var(--dinner)}
.seg button[aria-pressed="true"][data-v="snack"]{background:var(--snack)}
.seglab{font-weight:800;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}

.btn{font-family:inherit;font-weight:800;font-size:.86rem;padding:9px 15px;border-radius:999px;cursor:pointer;
  border:2px solid var(--line);background:var(--paper);color:var(--ink-soft);transition:all .15s ease;white-space:nowrap}
.btn:hover{border-color:var(--ink-soft);color:var(--ink)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--paper);min-height:46px;padding:11px 20px}
.btn.solid:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{font-size:.78rem;padding:7px 12px}
.remember{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:.84rem;color:var(--ink-soft);cursor:pointer;user-select:none}
.remember input{width:16px;height:16px;accent-color:var(--sun-deep)}

/* ---------------- spinner ---------------- */
.filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.catbox{border:2px solid var(--line);border-radius:16px;padding:10px 12px 12px;margin-top:10px}
.catbox:first-child{margin-top:0}
.catbox[data-cat="protein"]{border-color:var(--protein)}
.catbox[data-cat="carb"]{border-color:var(--carb)}
.catbox[data-cat="vegetable"]{border-color:var(--vegetable)}
.catbox[data-cat="wholemeal"]{border-color:var(--wholemeal)}
.catbox-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.catlabel{display:flex;align-items:center;gap:6px;font-family:"Grandstander","Nunito",sans-serif;font-weight:800;
  font-size:.76rem;color:var(--ink-muted);letter-spacing:.06em;text-transform:uppercase;margin:0}
.catlabel svg{flex:none}
.catbox[data-cat="protein"] .catlabel{color:var(--protein)}
.catbox[data-cat="carb"] .catlabel{color:var(--carb)}
.catbox[data-cat="vegetable"] .catlabel{color:var(--vegetable)}
.catbox[data-cat="wholemeal"] .catlabel{color:var(--wholemeal)}
.catspin-btn{font-family:inherit;font-weight:800;font-size:.68rem;letter-spacing:.02em;padding:5px 11px;border-radius:999px;
  cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);white-space:nowrap;flex:none}
.catspin-btn:hover{border-color:var(--ink-soft);color:var(--ink)}
.catspin-btn:disabled{opacity:.5;cursor:not-allowed}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0}
.reel{background:var(--paper-tint);border:2px solid var(--line);border-radius:13px;min-height:68px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 6px;text-align:center;
  box-shadow:inset 0 2px 6px rgba(30,35,80,.08)}
.reel.empty{border-style:dashed;opacity:.55}
.reel.ready{border-color:var(--good);background:var(--good-tint)}
.reel-text{font-family:"Grandstander","Nunito",sans-serif;font-weight:800;font-size:clamp(.78rem,2.2vw,.95rem);
  color:var(--ink);line-height:1.2;word-break:break-word}
.reel.ready .reel-text{color:var(--good)}
.reel-ing{font-weight:700;font-size:.66rem;color:var(--ink-muted);line-height:1.3;word-break:break-word}
.reels.pickable .reel{cursor:pointer}
.reels.pickable .reel:hover{border-color:var(--ink-soft)}
.reel.selected{border-color:var(--ink);border-width:3px}
.reel.ready.selected{border-color:var(--ink)}
.reel.selected::after{content:'✓';position:absolute;top:5px;right:6px;width:17px;height:17px;border-radius:50%;
  background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:800;line-height:1}
.spin-hint{text-align:center;margin:8px 0 0;font-weight:700;color:var(--ink-muted);font-size:.8rem}
.spin-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.spin-row.top{margin-top:0;margin-bottom:16px}
.spin-btn{font-size:1rem;padding:13px 32px;min-height:50px}

/* ---------------- add idea ---------------- */
.addrow{display:grid;grid-template-columns:1fr auto;gap:10px}
.addrow input{width:100%;font-family:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:var(--paper-tint);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px}
.addopts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.ming-input{width:100%;font-family:inherit;font-weight:700;font-size:.92rem;color:var(--ink);background:var(--paper-tint);
  border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;margin-top:10px}

/* ---------------- list ---------------- */
.seclabel{font-family:"Grandstander","Nunito",sans-serif;font-weight:800;font-size:.9rem;color:var(--ink-muted);
  letter-spacing:.06em;text-transform:uppercase;margin:16px 0 8px}
.seclabel:first-child{margin-top:0}
.seclabel .count{font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink-muted);font-size:.78rem}
.subhead{font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin:10px 0 6px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mitem{background:var(--paper-tint);border-radius:14px;padding:10px 14px}
.mrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mname{flex:1;min-width:120px;font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.ready-chip{font-family:inherit;font-weight:800;font-size:.7rem;letter-spacing:.03em;padding:6px 12px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink-muted);cursor:pointer;white-space:nowrap;flex:none}
.ready-chip[data-ready="true"]{background:var(--good-tint);color:var(--good);border-color:var(--good)}
.macts{display:flex;align-items:center;gap:4px;flex:none}
.iconbtn{border:none;background:transparent;color:var(--ink-muted);cursor:pointer;font-size:1rem;line-height:1;padding:5px 7px;border-radius:8px}
.iconbtn:hover{color:var(--ink);background:var(--paper)}
.ming{margin:6px 0 0;font-weight:700;font-size:.78rem;color:var(--ink-muted);line-height:1.4}

.editpanel{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.editpanel select{font-family:inherit;font-weight:700;font-size:.88rem;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.editpanel .ming-field{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.editpanel .ming-field input{font-family:inherit;font-weight:700;font-size:.88rem;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.editpanel .fa{margin-left:auto}

.empty{font-weight:700;color:var(--ink-muted);font-size:.9rem;padding:14px 4px}
.gothead{display:flex;align-items:center;gap:10px;margin-bottom:10px}

/* ---------------- saved sets ---------------- */
.setlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;align-items:center;gap:10px;background:var(--paper-tint);border-radius:14px;padding:10px 14px}
.setparts{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px 14px}
.setitem{font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.setcat{font-weight:800;font-size:.64rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);
  background:var(--paper);border:1px solid var(--line);padding:2px 7px;border-radius:999px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);z-index:70;
  background:var(--ink);color:var(--paper);font-weight:800;font-size:.9rem;padding:11px 20px;border-radius:999px;
  box-shadow:0 12px 30px rgba(20,25,60,.32);opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:600px){
  .addrow{grid-template-columns:1fr}
  .addrow .btn.solid{width:100%}
  .reel-text{font-size:.82rem}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
.hubnav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 0 0;max-width:860px;margin:0 auto}
.hubtab{font-family:"Grandstander","Nunito",sans-serif;font-weight:800;font-size:.82rem;

  border:1.5px solid var(--line)}
.hubtab.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
</style>

<!-- ============ Firebase: shared cross-device storage ============
     Same family-hub Firebase project the other pages use, in its own
     'meals/' document. Every device signs in anonymously just to
     satisfy the security rules — the whole family reads and writes the
     same list. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getFirestore, doc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  import {
    getAuth, signInAnonymously, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  var firebaseConfig = {
    apiKey: "AIzaSyC-3RaR0DtRUHXOs2ZziYw3rcoY0oUMFNA",
    authDomain: "familyhub-7ce5b.firebaseapp.com",
    projectId: "familyhub-7ce5b",
    storageBucket: "familyhub-7ce5b.firebasestorage.app",
    messagingSenderId: "430624150535",
    appId: "1:430624150535:web:ee6e142bb4f33d3c9b06a2"
  };

  var app = initializeApp(firebaseConfig);
  var firestore = getFirestore(app);
  var auth = getAuth(app);

  function makeDbShim(){
    return {
      doc: function(path){
        var ref = doc(firestore, path);
        return {
          set: function(data){ return setDoc(ref, data); },
          onSnapshot: function(onNext, onError){
            return onSnapshot(ref, function(snap){
              onNext({ exists: snap.exists(), data: function(){ return snap.data(); } });
            }, onError);
          }
        };
      }
    };
  }

  onAuthStateChanged(auth, function(user){
    if(user){
      window.__familyDb = makeDbShim();
      window.dispatchEvent(new Event('family-db-ready'));
    }
  });
  signInAnonymously(auth).catch(function(){
    window.dispatchEvent(new Event('family-db-error'));
  });
</script>

  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHTML(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var state = {
    ideas: [],
    mealType: 'dinner',
    addMealType: 'dinner',
    addDinnerCategory: 'protein',
    listOpen: false,
    editId: null,
    savedSets: []
  };

  var db = null, writing = 0, quiet = 0;
  var catSpinning = {};

  var toastEl = null, toastTimer = null;
  function toast(msg){
    if(!toastEl){
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    requestAnimationFrame(function(){ toastEl.classList.add('on'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2400);
  }

  /* ---------------- storage ---------------- */
  function saveLocal(){
    try{
      localStorage.setItem(LS, JSON.stringify({
        ideas: state.ideas, mealType: state.mealType, listOpen: state.listOpen, savedSets: state.savedSets
      }));
    }catch(e){}
  }
  function loadLocal(){
    try{
      var p = JSON.parse(localStorage.getItem(LS) || 'null');
      if(!p) return;
      if(Array.isArray(p.ideas)) state.ideas = p.ideas;
      if(p.mealType) state.mealType = p.mealType;
      if(typeof p.listOpen === 'boolean') state.listOpen = p.listOpen;
      if(Array.isArray(p.savedSets)) state.savedSets = p.savedSets;
    }catch(e){}
  }
  function persist(){
    saveLocal();
    if(!db) return;
    writing++;
    function done(){ writing = Math.max(0, writing-1); quiet = Date.now()+2000; }
    try{
      db.doc('meals/list').set({ideas: state.ideas, savedSets: state.savedSets, updatedAt: new Date().toISOString()})
        .then(done, function(){ done(); toast('Could not save to your account — kept on this device'); });
    }catch(e){ done(); }
  }
  function connect(){
    function wireUp(){
      db = window.__familyDb; markSync(true);
      db.doc('meals/list').onSnapshot(function(s){
        if(writing > 0 || Date.now() < quiet) return;
        if(!s.exists) return;
        var d = s.data() || {};
        var changed = false;
        if(Array.isArray(d.ideas)){ state.ideas = d.ideas; changed = true; }
        if(Array.isArray(d.savedSets)){ state.savedSets = d.savedSets; changed = true; }
        if(!changed) return;
        saveLocal();
        renderAll();
      }, function(){ toast('Lost the connection to your account — still saving on this device'); });
    }
    window.addEventListener('family-db-ready', wireUp);
    window.addEventListener('family-db-error', function(){ markSync(false); });
    if(window.__familyDb) wireUp(); else markSync(false);
  }
  function markSync(live){
    var chip = document.getElementById('syncChip');
    chip.classList.toggle('live', !!live);
    document.getElementById('syncText').textContent = live ? 'Synced across devices' : 'Saved on this device only';
  }

  /* ---------------- mutations ---------------- */
  function addIdea(name, mealType, hasIngredients, ingredients, dinnerCategory){
    state.ideas.push({
      id: uid(), name: name, mealType: mealType, hasIngredients: !!hasIngredients,
      ingredients: ingredients || '', dinnerCategory: dinnerCategory || ''
    });
    persist(); renderAll();
  }
  function updateIdea(id, patch){
    var it = state.ideas.filter(function(x){ return x.id === id; })[0];
    if(!it) return;
    Object.assign(it, patch);
    persist(); renderAll();
  }
  function removeIdea(id){
    state.ideas = state.ideas.filter(function(x){ return x.id !== id; });
    state.editId = null;
    persist(); renderAll();
  }
  function ideasFor(mealType){
    return state.ideas.filter(function(it){ return it.mealType === mealType; });
  }
  /* Dinner ideas added before categories existed (or left blank) count as
     "whole meal" rather than silently disappearing from every spinner. */
  function effectiveDinnerCategory(it){
    return it.dinnerCategory || 'wholemeal';
  }
  function categoriesFor(mealType){
    return mealType === 'dinner' ? DINNER_CATEGORIES : [null];
  }
  function ideasForSpin(mealType, cat){
    var pool = ideasFor(mealType);
    if(mealType !== 'dinner') return pool;
    return pool.filter(function(it){ return effectiveDinnerCategory(it) === cat; });
  }
  function saveCurrentSet(){
    var sels = currentSelections();
    if(!sels.length) return;
    state.savedSets.push({ id: uid(), createdAt: new Date().toISOString(), items: sels });
    persist(); renderAll();
    toast('Saved!');
  }
  function removeSavedSet(id){
    state.savedSets = state.savedSets.filter(function(s){ return s.id !== id; });
    persist(); renderAll();
  }

  /* ---------------- spinner ---------------- */
  function shuffled(arr){
    var out = arr.slice();
    for(var i=out.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }
  /* Picks up to 3 distinct ideas, favoring ones we already have ingredients
     for: if any "ready" idea exists in the pool, one is guaranteed among the
     picks, and the remaining slots are drawn from a pool where ready ideas
     are 3x as likely to be chosen - still a mix, not an all-ready lock. */
  function pickSpinResult(pool){
    var ready = pool.filter(function(it){ return it.hasIngredients; });
    var notReady = pool.filter(function(it){ return !it.hasIngredients; });
    var picks = [];
    if(ready.length){
      picks.push(ready.splice(Math.floor(Math.random()*ready.length), 1)[0]);
    }
    var weighted = [];
    ready.forEach(function(it){ weighted.push(it, it, it); });
    notReady.forEach(function(it){ weighted.push(it); });
    while(picks.length < 3 && weighted.length){
      var chosen = weighted[Math.floor(Math.random()*weighted.length)];
      weighted = weighted.filter(function(it){ return it !== chosen; });
      picks.push(chosen);
    }
    return shuffled(picks);
  }
  function renderSpinnerArea(){
    var host = document.getElementById('spinnerArea');
    var cats = categoriesFor(state.mealType);
    var isDinner = state.mealType === 'dinner';
    catSpinning = {};
    host.innerHTML = cats.map(function(cat){
      var reelsHTML = '<div class="reels'+(isDinner?' pickable':'')+'" data-cat="'+(cat||'')+'">'
        +   [0,1,2].map(function(i){
              return '<div class="reel" data-reel="'+i+'"><span class="reel-text">?</span><span class="reel-ing" hidden></span></div>';
            }).join('')
        + '</div>'
        + '<p class="spin-hint" data-cathint="'+(cat||'')+'" hidden></p>';
      if(!cat) return reelsHTML;
      return '<div class="catbox" data-cat="'+cat+'">'
        + '<div class="catbox-head">'
        +   '<p class="catlabel">'+DINNER_CATEGORY_ICON[cat]+'<span>'+DINNER_CATEGORY_LABEL[cat]+'</span></p>'
        +   '<button type="button" class="catspin-btn" data-catspin="'+cat+'">Spin</button>'
        + '</div>'
        + reelsHTML
        + '</div>';
    }).join('');
    if(isDinner) wireReelClicks(host);
    wireCatSpinButtons(host);
    document.getElementById('spinBtn').textContent = isDinner ? 'Spin all' : 'Spin!';
  }
  function wireReelClicks(host){
    host.querySelectorAll('.reel').forEach(function(reelEl){
      reelEl.addEventListener('click', function(){
        var cat = reelEl.closest('.reels').dataset.cat || '';
        if(catSpinning[cat] || !reelEl.dataset.ideaId) return;
        var reelsBlock = reelEl.closest('.reels');
        var wasSelected = reelEl.classList.contains('selected');
        reelsBlock.querySelectorAll('.reel').forEach(function(r){ r.classList.remove('selected'); });
        if(!wasSelected) reelEl.classList.add('selected');
        updateSaveButton();
      });
    });
  }
  function wireCatSpinButtons(host){
    host.querySelectorAll('[data-catspin]').forEach(function(btn){
      btn.addEventListener('click', function(){ spinCategory(btn.dataset.catspin, null); });
    });
  }
  function currentSelections(){
    var out = [];
    document.querySelectorAll('.reel.selected').forEach(function(reelEl){
      var cat = reelEl.closest('.reels').dataset.cat || '';
      out.push({ id: reelEl.dataset.ideaId, name: reelEl.dataset.ideaName, category: cat || null });
    });
    return out;
  }
  function updateSaveButton(){
    var sels = state.mealType === 'dinner' ? currentSelections() : [];
    document.getElementById('saveRow').hidden = sels.length === 0;
  }
  function updateSpinAvailability(){
    var cats = categoriesFor(state.mealType);
    var anyAvailable = false;
    cats.forEach(function(cat){
      var pool = ideasForSpin(state.mealType, cat);
      if(pool.length) anyAvailable = true;
      var catBtn = document.querySelector('[data-catspin="'+(cat||'')+'"]');
      if(catBtn) catBtn.disabled = pool.length === 0;
      var hintEl = document.querySelector('[data-cathint="'+(cat||'')+'"]');
      if(!hintEl) return;
      var label = cat ? DINNER_CATEGORY_LABEL[cat].toLowerCase() : MEAL_LABEL[state.mealType].toLowerCase();
      if(pool.length === 0){
        hintEl.hidden = false;
        hintEl.textContent = 'Add a ' + label + ' idea below, then spin!';
      } else if(pool.length < 3){
        hintEl.hidden = false;
        hintEl.textContent = 'Only ' + pool.length + ' ' + label
          + ' idea' + (pool.length > 1 ? 's' : '') + ' so far — add more to fill all three reels.';
      } else {
        hintEl.hidden = true;
      }
    });
    document.getElementById('spinBtn').disabled = !anyAvailable;
  }
  function spinReel(el, finalText, duration, names, onDone){
    var start = Date.now();
    var tick = 55;
    function step(){
      var elapsed = Date.now() - start;
      if(elapsed >= duration){
        el.textContent = finalText;
        onDone();
        return;
      }
      el.textContent = names[Math.floor(Math.random()*names.length)];
      tick = Math.min(tick * 1.14, 260);
      setTimeout(step, tick);
    }
    step();
  }
  /* Spins just one category's 3 reels. onDone (optional) fires once that
     category's reels have all landed - used by spin() to know when every
     category in a "spin all" has finished. */
  function spinCategory(cat, onDone){
    var key = cat || '';
    if(catSpinning[key]) return;
    var pool = ideasForSpin(state.mealType, cat);
    if(!pool.length){ if(onDone) onDone(); return; }
    catSpinning[key] = true;
    var catBtn = document.querySelector('[data-catspin="'+key+'"]');
    if(catBtn) catBtn.disabled = true;
    var names = pool.map(function(it){ return it.name; });
    var picks = pickSpinResult(pool);
    var durations = [900, 1250, 1650];
    var remaining = 3;
    var reelsEl = document.querySelector('.reels[data-cat="'+key+'"]');
    [0,1,2].forEach(function(idx){
      var reelEl = reelsEl.querySelector('.reel[data-reel="'+idx+'"]');
      var textEl = reelEl.querySelector('.reel-text');
      var ingEl = reelEl.querySelector('.reel-ing');
      var finalIdea = picks[idx];
      reelEl.classList.remove('ready', 'selected');
      reelEl.classList.toggle('empty', !finalIdea);
      if(finalIdea){ reelEl.dataset.ideaId = finalIdea.id; reelEl.dataset.ideaName = finalIdea.name; }
      else { delete reelEl.dataset.ideaId; delete reelEl.dataset.ideaName; }
      ingEl.hidden = true; ingEl.textContent = '';
      spinReel(textEl, finalIdea ? finalIdea.name : '—', durations[idx], names, function(){
        if(finalIdea && finalIdea.ingredients){
          ingEl.textContent = finalIdea.ingredients;
          ingEl.hidden = false;
        }
        reelEl.classList.toggle('ready', !!(finalIdea && finalIdea.hasIngredients));
        remaining--;
        if(remaining === 0){
          catSpinning[key] = false;
          if(catBtn) catBtn.disabled = false;
          updateSaveButton();
          if(onDone) onDone();
        }
      });
    });
  }
  function spin(){
    var cats = categoriesFor(state.mealType);
    var anyAvailable = cats.some(function(cat){ return ideasForSpin(state.mealType, cat).length > 0; });
    if(!anyAvailable){ updateSpinAvailability(); return; }
    var isDinner = state.mealType === 'dinner';
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('saveRow').hidden = true;
    /* Skip (don't wait on) a category that's already spinning on its own -
       spinCategory() would no-op for it anyway, and waiting on it here
       could leave this button disabled forever if that other spin was
       started independently. */
    var pending = cats.filter(function(cat){ return !catSpinning[cat || '']; });
    function finish(){
      document.getElementById('spinBtn').disabled = false;
      document.getElementById('spinBtn').textContent = isDinner ? 'Spin all' : 'Spin again';
    }
    if(!pending.length){ finish(); return; }
    var remaining = pending.length;
    pending.forEach(function(cat){
      spinCategory(cat, function(){
        remaining--;
        if(remaining === 0) finish();
      });
    });
  }

  /* ---------------- rendering: add idea list ---------------- */
  function ideaRowHTML(it){
    var open = state.editId === it.id;
    return '<li class="mitem" data-id="'+it.id+'">'
      + '<div class="mrow">'
      +   '<span class="mname">'+escapeHTML(it.name)+'</span>'
      +   '<button class="ready-chip" data-ready="'+(it.hasIngredients?'true':'false')+'" data-toggle="'+it.id+'">'
      +     (it.hasIngredients ? '✓ Have it' : 'Need items')
      +   '</button>'
      +   '<span class="macts">'
      +     '<button class="iconbtn" data-edit="'+it.id+'" title="Edit" aria-label="Edit '+escapeHTML(it.name)+'">✎</button>'
      +     '<button class="iconbtn" data-del="'+it.id+'" title="Remove" aria-label="Remove '+escapeHTML(it.name)+'">×</button>'
      +   '</span>'
      + '</div>'
      + (it.ingredients ? '<p class="ming">'+escapeHTML(it.ingredients)+'</p>' : '')
      + (open ? editPanelHTML(it) : '')
      + '</li>';
  }
  function editPanelHTML(it){
    var mealOpts = MEAL_TYPES.map(function(t){
      return '<option value="'+t+'"'+(t===it.mealType?' selected':'')+'>'+MEAL_LABEL[t]+'</option>';
    }).join('');
    var catField = '';
    if(it.mealType === 'dinner'){
      var catOpts = DINNER_CATEGORIES.map(function(c){
        return '<option value="'+c+'"'+(effectiveDinnerCategory(it)===c?' selected':'')+'>'+DINNER_CATEGORY_LABEL[c]+'</option>';
      }).join('');
      catField = '<label class="seglab">Category <select data-field="dinnercategory">'+catOpts+'</select></label>';
    }
    return '<div class="editpanel" data-editpanel="'+it.id+'">'
      +   '<label class="seglab">Meal <select data-field="mealtype">'+mealOpts+'</select></label>'
      +   catField
      +   '<label class="seglab ming-field">Main ingredients'
      +     '<input type="text" data-field="ingredients" value="'+escapeHTML(it.ingredients||'')+'" placeholder="e.g. ground beef, tortillas, cheese">'
      +   '</label>'
      +   '<button type="button" class="btn ghost fa" data-editclose="1">Close</button>'
      + '</div>';
  }
  function renderList(){
    document.getElementById('listToggle').textContent = state.listOpen ? 'Hide' : 'Show list';
    document.getElementById('listBody').hidden = !state.listOpen;
    document.getElementById('listEyebrow').textContent = 'Meal idea list (' + state.ideas.length + ')';
    if(!state.listOpen) return;
    var host = document.getElementById('listBody');
    if(!state.ideas.length){
      host.innerHTML = '<p class="empty">No meal ideas yet — add your first one above.</p>';
      return;
    }
    function byName(a,b){ return a.name.localeCompare(b.name); }
    var html = '';
    MEAL_TYPES.forEach(function(type){
      var list = ideasFor(type);
      if(!list.length) return;
      var readyCount = list.filter(function(it){ return it.hasIngredients; }).length;
      html += '<p class="seclabel">'+MEAL_LABEL[type]+' <span class="count">('+readyCount+' of '+list.length+' ready)</span></p>';
      if(type === 'dinner'){
        DINNER_CATEGORIES.forEach(function(cat){
          var sub = list.filter(function(it){ return effectiveDinnerCategory(it) === cat; }).slice().sort(byName);
          if(!sub.length) return;
          html += '<p class="subhead">'+DINNER_CATEGORY_LABEL[cat]+'</p>'
            + '<ul class="mlist">' + sub.map(ideaRowHTML).join('') + '</ul>';
        });
      } else {
        html += '<ul class="mlist">' + list.slice().sort(byName).map(ideaRowHTML).join('') + '</ul>';
      }
    });
    host.innerHTML = html;
    wireRows(host);
  }
  function renderSavedSets(){
    var host = document.getElementById('savedSetsBody');
    if(!state.savedSets.length){
      host.innerHTML = '<p class="empty">No saved sets yet — spin for dinner, click your favorites in each category, and save the combo.</p>';
      return;
    }
    var CAT_ORDER = {protein:0, carb:1, vegetable:2, wholemeal:3};
    var sorted = state.savedSets.slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
    host.innerHTML = '<ul class="setlist">' + sorted.map(function(set){
      var items = set.items.slice().sort(function(a,b){
        var ao = CAT_ORDER[a.category] != null ? CAT_ORDER[a.category] : 9;
        var bo = CAT_ORDER[b.category] != null ? CAT_ORDER[b.category] : 9;
        return ao - bo;
      });
      var parts = items.map(function(it){
        var tag = it.category ? '<span class="setcat">'+DINNER_CATEGORY_LABEL[it.category]+'</span>' : '';
        return '<span class="setitem">'+tag+escapeHTML(it.name)+'</span>';
      }).join('');
      return '<li class="setrow" data-id="'+set.id+'"><div class="setparts">'+parts+'</div>'
        + '<button class="iconbtn" data-delset="'+set.id+'" title="Remove" aria-label="Remove saved set">×</button></li>';
    }).join('') + '</ul>';
    host.querySelectorAll('[data-delset]').forEach(function(el){
      el.addEventListener('click', function(){ removeSavedSet(el.dataset.delset); });
    });
  }
  function wireRows(host){
    host.querySelectorAll('[data-toggle]').forEach(function(el){
      el.addEventListener('click', function(){ updateIdea(el.dataset.toggle, {hasIngredients: el.dataset.ready !== 'true'}); });
    });
    host.querySelectorAll('[data-del]').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); removeIdea(el.dataset.del); });
    });
    host.querySelectorAll('[data-edit]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var same = state.editId === el.dataset.edit;
        state.editId = same ? null : el.dataset.edit;
        renderAll();
      });
    });
    var panel = host.querySelector('[data-editpanel]');
    if(panel){
      var id = panel.dataset.editpanel;
      panel.querySelector('[data-field="mealtype"]').addEventListener('change', function(){ updateIdea(id, {mealType: this.value}); });
      var catSelect = panel.querySelector('[data-field="dinnercategory"]');
      if(catSelect) catSelect.addEventListener('change', function(){ updateIdea(id, {dinnerCategory: this.value}); });
      panel.querySelector('[data-field="ingredients"]').addEventListener('change', function(){ updateIdea(id, {ingredients: this.value.trim()}); });
      panel.querySelector('[data-editclose]').addEventListener('click', function(e){
        e.stopPropagation(); state.editId = null; renderAll();
      });
    }
  }

  function paintSegs(){
    document.querySelectorAll('#mealTypeFilter button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.v === state.mealType ? 'true':'false'); });
    document.querySelectorAll('#addMealType button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.v === state.addMealType ? 'true':'false'); });
    document.querySelectorAll('#addDinnerCat button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.v === state.addDinnerCategory ? 'true':'false'); });
    var showCat = state.addMealType === 'dinner';
    document.getElementById('addDinnerCat').hidden = !showCat;
    document.getElementById('addDinnerCatLabel').hidden = !showCat;
  }

  function renderAll(){
    paintSegs();
    updateSpinAvailability();
    renderList();
    renderSavedSets();
  }

  /* ---------------- wiring ---------------- */
  document.getElementById('mealTypeFilter').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.mealType = b.dataset.v; saveLocal();
    renderSpinnerArea(); paintSegs(); updateSpinAvailability(); updateSaveButton();
  });
  document.getElementById('addMealType').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.addMealType = b.dataset.v; paintSegs();
  });
  document.getElementById('addDinnerCat').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.addDinnerCategory = b.dataset.v; paintSegs();
  });
  document.getElementById('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var input = document.getElementById('addName');
    var name = input.value.trim();
    if(!name) return;
    var hasIngredients = document.getElementById('addHasIngredients').checked;
    var ingredientsInput = document.getElementById('addIngredients');
    var dinnerCategory = state.addMealType === 'dinner' ? state.addDinnerCategory : '';
    addIdea(name, state.addMealType, hasIngredients, ingredientsInput.value.trim(), dinnerCategory);
    input.value = '';
    ingredientsInput.value = '';
    document.getElementById('addHasIngredients').checked = false;
    input.focus();
  });
  document.getElementById('spinBtn').addEventListener('click', spin);
  document.getElementById('saveSetBtn').addEventListener('click', saveCurrentSet);
  document.getElementById('listToggle').addEventListener('click', function(){
    state.listOpen = !state.listOpen; saveLocal(); renderList();
  });

  loadLocal();
  saveLocal();
  markSync(false);
  renderSpinnerArea();
  renderAll();
  connect();
})();
</script>
</body></html>
