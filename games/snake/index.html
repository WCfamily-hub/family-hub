<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>Family Snake — Family Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --sky-top:#DDE9FF;--sky-bot:#FFE7D4;--paper:#FFFFFF;--paper-tint:#F5F8FF;
  --ink:#1E2350;--ink-soft:#5C6396;--ink-muted:#8B92C0;--line:#CFD9F2;
  --sun:#FFC13B;--sun-deep:#EE9B14;--zev:#0F9E98;--zev-tint:#DFF5F3;--eve:#DE4E88;--eve-tint:#FCE2EC;
  --good:#0ca30c;--bad:#D14343;
  --shadow:0 10px 30px rgba(30,35,80,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#0D1233;--sky-bot:#2A1A3C;--paper:#191F45;--paper-tint:#141A3B;
    --ink:#EEF2FF;--ink-soft:#A6AFDF;--ink-muted:#7E86B8;--line:#333C74;
    --sun:#FFCE5C;--sun-deep:#FFB021;--zev:#43D8CD;--zev-tint:#0E3B39;--eve:#FF86B4;--eve-tint:#432031;
    --good:#2ECC40;--bad:#FF6B6B;
    --shadow:0 10px 30px rgba(0,0,0,.32);
  }
}
*{box-sizing:border-box}
body{
  margin:0;font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);background:linear-gradient(168deg,var(--sky-top) 0%,var(--sky-bot) 100%);
  background-attachment:fixed;min-height:100vh;-webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:clamp(16px,3vw,28px) clamp(14px,3vw,20px) 56px;display:flex;flex-direction:column;align-items:center}
.back{align-self:flex-start;margin-bottom:14px;font-weight:800;font-size:.84rem;color:var(--ink-soft);text-decoration:none}
.back:hover{color:var(--ink)}
h1{font-family:"Grandstander","Nunito",sans-serif;font-weight:800;font-size:clamp(1.7rem,4.5vw,2.3rem);margin:0 0 .2em;text-align:center}
.sub{margin:0 0 20px;font-weight:700;color:var(--ink-soft);font-size:.9rem;text-align:center;max-width:380px}

.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  padding:clamp(16px,2.6vw,24px);width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}

.roster{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:360px}
.who{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper-tint);border:2px solid var(--line);
  border-radius:18px;padding:14px 10px;cursor:pointer;font-family:inherit;color:var(--ink)}
.who:hover{border-color:var(--sun-deep)}
.who svg{width:64px;height:64px}
.who span{font-weight:800;font-size:.9rem}

.scorebar{display:flex;gap:10px;width:100%;max-width:432px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--paper-tint);font-weight:800;font-size:.8rem;color:var(--ink-soft)}
.pill b{color:var(--ink)}

#boardWrap{position:relative;width:100%;max-width:432px;aspect-ratio:1/1}
#board{width:100%;height:100%;display:block;border-radius:16px;background:var(--paper-tint);border:1.5px solid var(--line)}
.overlay{position:absolute;inset:0;border-radius:16px;background:rgba(30,35,80,.55);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:16px}
.overlay h2{font-family:"Grandstander","Nunito",sans-serif;margin:0;font-size:1.5rem}
.overlay p{margin:0;font-weight:700;font-size:.9rem;opacity:.9}
[hidden]{display:none!important}

.btn{appearance:none;border:2px solid var(--ink);background:var(--ink);color:#fff;font-family:inherit;font-weight:800;
  font-size:.88rem;border-radius:999px;padding:10px 20px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.light{background:#fff;color:var(--ink);border-color:#fff}

.controls{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.dpad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px}
.dbtn{appearance:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:12px;
  font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.dbtn:active{background:var(--paper-tint)}
.dpad .up{grid-area:1/2}.dpad .left{grid-area:2/1}.dpad .down{grid-area:3/2}.dpad .right{grid-area:2/3}
.hint{font-weight:700;color:var(--ink-muted);font-size:.78rem;text-align:center}

.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>

<div class="wrap">
  <a class="back" href="../../">← Family Hub</a>
  <h1>Family Snake</h1>
  <p class="sub">Pick who you're playing as, then grow your family by collecting everyone else!</p>

  <div class="panel">
    <section id="selectView" class="roster" aria-label="Choose your player"></section>

    <div id="gameView" hidden style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="scorebar">
        <span class="pill">Collected: <b id="scoreOut">0</b></span>
        <span class="pill">Best: <b id="bestOut">0</b></span>
        <button class="btn ghost" id="switchBtn" style="padding:7px 14px;font-size:.78rem">Change player</button>
      </div>

      <div id="boardWrap">
        <canvas id="board" width="432" height="432"></canvas>
        <div id="startOverlay" class="overlay">
          <h2>Ready?</h2>
          <p>Arrow keys, WASD, swipe, or the buttons below.</p>
          <button class="btn light" id="startBtn">Start</button>
        </div>
        <div id="pauseOverlay" class="overlay" hidden>
          <h2>Paused</h2>
          <button class="btn light" id="resumeBtn">Resume</button>
        </div>
        <div id="overOverlay" class="overlay" hidden>
          <h2>Game over!</h2>
          <p id="overMsg"></p>
          <div class="rowbtns">
            <button class="btn light" id="againBtn">Play again</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="dpad">
          <button class="dbtn up" data-dir="up" aria-label="Up">▲</button>
          <button class="dbtn left" data-dir="left" aria-label="Left">◀</button>
          <button class="dbtn down" data-dir="down" aria-label="Down">▼</button>
          <button class="dbtn right" data-dir="right" aria-label="Right">▶</button>
        </div>
        <p class="hint">Space to pause</p>
      </div>
    </div>
  </div>
</div>

<script>
var FACES = {
  dad: { name: "Dad", accent: "#2B2B2B", svg:
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">' +
    '<circle cx="24" cy="25" r="20" fill="#E8B98C" stroke="#C98F5C" stroke-width="2"/>' +
    '<path d="M5 21c0-11 8.5-18 19-18s19 7 19 18c-3-3.5-8-5.5-10.5-3.2-2-3-5.8-4-8.5-4s-6.5 1-8.5 4C13 15.5 8 17.5 5 21z" fill="#2B2B2B"/>' +
    '<g fill="none" stroke="#222" stroke-width="2.6">' +
    '<rect x="9.5" y="23" width="11" height="8.5" rx="2.4"/>' +
    '<rect x="27.5" y="23" width="11" height="8.5" rx="2.4"/>' +
    '<path d="M20.5 26.5h7"/>' +
    '</g>' +
    '<circle cx="15" cy="27.3" r="1.6" fill="#222"/><circle cx="33" cy="27.3" r="1.6" fill="#222"/>' +
    '<path d="M17.5 36.5c2.5 2.6 10.5 2.6 13 0" fill="none" stroke="#7a4b2e" stroke-width="2.2" stroke-linecap="round"/>' +
    '</svg>' },
  mom: { name: "Mom", accent: "#8B4C39", svg:
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">' +
    '<path d="M6 30c-1-13 3-26 18-26s19 13 18 26c0 7-4 10-4 10H10s-4-3-4-10z" fill="#9C6B3F"/>' +
    '<circle cx="24" cy="25" r="20" fill="#FFE0C7" stroke="#F0C9A6" stroke-width="2"/>' +
    '<path d="M4 23c-1-13 7-21 20-21s21 8 20 21c-3-6-10-8-11-5-2-5-6.5-7-9-7s-7 2-9 7c-1-3-8-1-11 5z" fill="#9C6B3F"/>' +
    '<g fill="none" stroke="#6B3B2E" stroke-width="2.6">' +
    '<circle cx="15.5" cy="27.3" r="5.6"/><circle cx="32.5" cy="27.3" r="5.6"/><path d="M21 27.3h6"/>' +
    '</g>' +
    '<circle cx="15.5" cy="27.3" r="1.6" fill="#222"/><circle cx="32.5" cy="27.3" r="1.6" fill="#222"/>' +
    '<path d="M17.5 36.5c2.5 2.6 10.5 2.6 13 0" fill="none" stroke="#9a5a44" stroke-width="2.2" stroke-linecap="round"/>' +
    '</svg>' },
  eve: { name: "Eve", accent: "#DE4E88", svg:
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">' +
    '<circle cx="9" cy="17" r="5.5" fill="#4A2E1E"/><circle cx="39" cy="17" r="5.5" fill="#4A2E1E"/>' +
    '<circle cx="9" cy="17" r="2.4" fill="#DE4E88"/><circle cx="39" cy="17" r="2.4" fill="#DE4E88"/>' +
    '<circle cx="24" cy="25" r="20" fill="#F2C9A0" stroke="#DDA876" stroke-width="2"/>' +
    '<path d="M5 20c0-11 8.5-18 19-18s19 7 19 18c-3-3-7.5-4.5-10-3-2.5-2.5-6-3.3-9-3.3s-6.5.8-9 3.3c-2.5-1.5-7-.5-10 3z" fill="#4A2E1E"/>' +
    '<g fill="none" stroke="#DE4E88" stroke-width="2.4">' +
    '<circle cx="15.5" cy="27" r="5"/><circle cx="32.5" cy="27" r="5"/><path d="M20.5 27h7"/>' +
    '</g>' +
    '<circle cx="15.5" cy="27" r="1.5" fill="#222"/><circle cx="32.5" cy="27" r="1.5" fill="#222"/>' +
    '<path d="M17.5 36.5c2.5 2.6 10.5 2.6 13 0" fill="none" stroke="#b5673f" stroke-width="2.2" stroke-linecap="round"/>' +
    '</svg>' },
  zev: { name: "Zev", accent: "#0F9E98", svg:
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">' +
    '<path d="M11 38c0-6 5.8-9 13-9s13 3 13 9z" fill="#0F9E98"/>' +
    '<circle cx="24" cy="24" r="19.5" fill="#F0C49C" stroke="#DDA876" stroke-width="2"/>' +
    '<path d="M6 20c0-11 8-17.5 18-17.5s18 6.5 18 17.5c-2.5-5-8-7.5-18-7.5S8.5 15 6 20z" fill="#3A2A1E"/>' +
    '<circle cx="15.5" cy="26.3" r="1.6" fill="#222"/><circle cx="32.5" cy="26.3" r="1.6" fill="#222"/>' +
    '<path d="M17.5 35.5c2.5 2.6 10.5 2.6 13 0" fill="none" stroke="#b5673f" stroke-width="2.2" stroke-linecap="round"/>' +
    '</svg>' }
};
var FACE_KEYS = Object.keys(FACES);

var selectView = document.getElementById('selectView');
var gameView = document.getElementById('gameView');
FACE_KEYS.forEach(function(key){
  var btn = document.createElement('button');
  btn.className = 'who';
  btn.innerHTML = FACES[key].svg + '<span>' + FACES[key].name + '</span>';
  btn.addEventListener('click', function(){ choosePlayer(key); });
  selectView.appendChild(btn);
});

var images = {};
function loadFaceImages(cb){
  var keys = FACE_KEYS, remaining = keys.length;
  keys.forEach(function(key){
    var img = new Image();
    img.onload = function(){ if(--remaining === 0) cb(); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(FACES[key].svg);
    images[key] = img;
  });
}

var GRID = 18, CELL = 24;
var canvas = document.getElementById('board');
var ctx = canvas.getContext('2d');
var scoreOut = document.getElementById('scoreOut');
var bestOut = document.getElementById('bestOut');
var startOverlay = document.getElementById('startOverlay');
var pauseOverlay = document.getElementById('pauseOverlay');
var overOverlay = document.getElementById('overOverlay');
var overMsg = document.getElementById('overMsg');

var player = null, otherKeys = [];
var snake, cars, dir, pendingDir, food, score, best, speed, timer, running, alive;
var BASE_SPEED = 160, MIN_SPEED = 85;

function bestKey(){ return 'familySnakeHighScore'; }
function loadBest(){ try { return parseInt(localStorage.getItem(bestKey()) || '0', 10) || 0; } catch(e){ return 0; } }
function saveBest(v){ try { localStorage.setItem(bestKey(), String(v)); } catch(e){} }

function choosePlayer(key){
  player = key;
  otherKeys = FACE_KEYS.filter(function(k){ return k !== key; });
  selectView.parentNode.hidden = false;
  selectView.hidden = true;
  gameView.hidden = false;
  best = loadBest();
  bestOut.textContent = best;
  resetGame();
}

document.getElementById('switchBtn').addEventListener('click', function(){
  clearInterval(timer);
  gameView.hidden = true;
  selectView.hidden = false;
});

function randEmptyCell(){
  while(true){
    var x = Math.floor(Math.random() * GRID), y = Math.floor(Math.random() * GRID);
    var hit = snake.some(function(p){ return p.x === x && p.y === y; });
    if(!hit) return { x: x, y: y };
  }
}

function spawnFood(){
  var cell = randEmptyCell();
  var key = otherKeys[Math.floor(Math.random() * otherKeys.length)];
  food = { x: cell.x, y: cell.y, face: key };
}

function resetGame(){
  snake = [{ x: Math.floor(GRID/2), y: Math.floor(GRID/2) }];
  cars = [];
  dir = { x: 1, y: 0 };
  pendingDir = dir;
  score = 0;
  speed = BASE_SPEED;
  alive = false;
  running = false;
  scoreOut.textContent = score;
  spawnFood();
  draw();
  startOverlay.hidden = false;
  pauseOverlay.hidden = true;
  overOverlay.hidden = true;
}

function startGame(){
  startOverlay.hidden = true;
  overOverlay.hidden = true;
  alive = true;
  running = true;
  clearInterval(timer);
  timer = setInterval(tick, speed);
}

function setSpeed(ms){
  speed = Math.max(MIN_SPEED, ms);
  if(running){ clearInterval(timer); timer = setInterval(tick, speed); }
}

function setDir(nx, ny){
  if(dir.x === -nx && dir.y === -ny) return;
  pendingDir = { x: nx, y: ny };
}

function tick(){
  if(!running) return;
  dir = pendingDir;
  var head = snake[0];
  var newHead = { x: head.x + dir.x, y: head.y + dir.y };

  if(newHead.x < 0 || newHead.x >= GRID || newHead.y < 0 || newHead.y >= GRID){ return gameOver(); }
  var selfHit = snake.some(function(p){ return p.x === newHead.x && p.y === newHead.y; });
  if(selfHit){ return gameOver(); }

  var ate = newHead.x === food.x && newHead.y === food.y;
  snake.unshift(newHead);
  if(ate){
    cars.unshift(food.face);
    score++;
    scoreOut.textContent = score;
    if(score % 5 === 0) setSpeed(speed - 10);
    spawnFood();
  } else {
    snake.pop();
  }
  draw();
}

function gameOver(){
  running = false;
  alive = false;
  clearInterval(timer);
  if(score > best){
    best = score;
    saveBest(best);
    bestOut.textContent = best;
    overMsg.textContent = 'New best — ' + score + (score === 1 ? ' family member' : ' family members') + ' collected!';
  } else {
    overMsg.textContent = 'Family collected: ' + score + '.';
  }
  overOverlay.hidden = false;
}

function draw(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--paper-tint') || '#F5F8FF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if(images[food.face] && images[food.face].complete){
    ctx.drawImage(images[food.face], food.x * CELL + 1, food.y * CELL + 1, CELL - 2, CELL - 2);
  }

  for(var i = snake.length - 1; i >= 0; i--){
    var p = snake[i];
    var key = i === 0 ? player : cars[i - 1];
    if(!key) continue;
    var img = images[key];
    var pad = i === 0 ? 0 : 1.5;
    if(img && img.complete){
      ctx.drawImage(img, p.x * CELL + pad, p.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
    }
  }
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', function(){ resetGame(); startGame(); });
document.getElementById('resumeBtn').addEventListener('click', function(){
  pauseOverlay.hidden = true; running = true; timer = setInterval(tick, speed);
});

function togglePause(){
  if(!alive) return;
  if(running){ running = false; clearInterval(timer); pauseOverlay.hidden = false; }
  else { pauseOverlay.hidden = true; running = true; timer = setInterval(tick, speed); }
}

var KEYMAP = {
  ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
  w: [0,-1], s: [0,1], a: [-1,0], d: [1,0], W: [0,-1], S: [0,1], A: [-1,0], D: [1,0]
};
document.addEventListener('keydown', function(e){
  if(gameView.hidden) return;
  if(e.code === 'Space'){ e.preventDefault(); togglePause(); return; }
  var m = KEYMAP[e.key];
  if(m){ e.preventDefault(); setDir(m[0], m[1]); }
});

document.querySelectorAll('.dbtn').forEach(function(btn){
  btn.addEventListener('click', function(){
    var d = btn.dataset.dir;
    if(d === 'up') setDir(0,-1); else if(d === 'down') setDir(0,1);
    else if(d === 'left') setDir(-1,0); else if(d === 'right') setDir(1,0);
  });
});

var touchStart = null;
canvas.addEventListener('touchstart', function(e){
  var t = e.changedTouches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
canvas.addEventListener('touchend', function(e){
  if(!touchStart) return;
  var t = e.changedTouches[0];
  var dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if(Math.abs(dx) < 16 && Math.abs(dy) < 16) return;
  if(Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
  touchStart = null;
}, { passive: true });

loadFaceImages(function(){});
</script>
</body></html>
