  --sun:#FFC13B;--sun-deep:#EE9B14;--good:#0ca30c;
  --shadow:0 10px 30px rgba(30,35,80,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --ground-top:#0D1233;--ground-bot:#241E38;--paper:#191F45;--paper-tint:#141A3B;
    --ink:#EEF2FF;--ink-soft:#A6AFDF;--ink-muted:#7E86B8;--line:#333C74;
    --sun:#FFCE5C;--sun-deep:#FFB021;--good:#3ecb3e;
    --shadow:0 10px 30px rgba(0,0,0,.32);
  }
}
*{box-sizing:border-box}
body{
  margin:0;font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);background:linear-gradient(168deg,var(--ground-top) 0%,var(--ground-bot) 100%);
  background-attachment:fixed;min-height:100vh;-webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:clamp(16px,3vw,32px) clamp(14px,3vw,24px) 56px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.mark{width:44px;height:44px;flex:none}
h1{font-family:"Grandstander","Nunito",sans-serif;font-weight:800;font-size:clamp(1.8rem,3.8vw,2.5rem);margin:0;line-height:1}
.sub{margin:.3em 0 0;font-weight:700;color:var(--ink-soft);font-size:clamp(.85rem,1.3vw,.95rem)}
.submit{margin:14px 0 26px;font-weight:700;font-size:.86rem;color:var(--ink-soft)}
.submit a{color:var(--sun-deep);font-weight:800;text-decoration:none}
.submit a:hover{text-decoration:underline}

.toc{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 28px}
.toc a{font-family:"Grandstander","Nunito",sans-serif;font-weight:800;font-size:.78rem;
  padding:6px 13px;border-radius:999px;text-decoration:none;color:var(--ink-soft);background:var(--paper);
  border:1.5px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--ink-soft)}

.catcard{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:clamp(16px,2.4vw,22px);margin-bottom:16px}
.cathead{font-family:"Grandstander","Nunito",sans-serif;font-weight:800;font-size:1.2rem;margin:0 0 4px;color:var(--ink);scroll-margin-top:16px}
.subhead{font-weight:800;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin:16px 0 8px}
.subhead:first-of-type{margin-top:4px}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;margin:0}
.rlist a{display:flex;align-items:center;gap:6px;padding:5px 0;text-decoration:none;color:var(--ink-soft);font-weight:700;font-size:.92rem;line-height:1.35}
.rlist a:hover{color:var(--ink);text-decoration:underline}
.rlist a.done{color:var(--good);font-weight:800}
.rlist a.done:hover{color:var(--good)}
.ext{flex:none;color:var(--ink-muted);font-size:.78em}

.foot{text-align:center;font-weight:700;font-size:.8rem;color:var(--ink-muted);margin-top:20px;line-height:1.6}
</style>

    var id = slug(name);
    toc.innerHTML += '<a href="#'+id+'">'+name+'</a>';
    html += '<section class="catcard"><h2 class="cathead" id="'+id+'">'+name+'</h2>';
    if(flat){
      html += '<div class="rlist">' + flat.map(function(r){ return linkHTML(r[0], r[1]); }).join('') + '</div>';
    }
    if(subs){
      subs.forEach(function(sub){
        html += '<p class="subhead">'+sub[0]+'</p><div class="rlist">'
          + sub[1].map(function(r){ return linkHTML(r[0], r[1]); }).join('') + '</div>';
      });
    }
    html += '</section>';
  });
  host.innerHTML = html;
})();
</script>
</body></html>
